name: Tests and type check
description: >-
  Installs what requirements-test.txt pins - on a development branch with the libraries' branch
  of the same name in place of their pins - under Home Assistant's package constraints, and Home
  Assistant's version of each package the integration requires that its own integrations pin,
  then runs pyright strict, the tests with full coverage, the repository's contract and the
  template check. Where hacs.json supports a Home Assistant older than the one pinned, it then
  installs the same for that Home Assistant and runs pyright, the tests and the contract with it
  too. The repository must already be checked out.

inputs:
  branch:
    description: >-
      The branch the commit is on. Libraries developed alongside the integration are taken from
      their branch of this name, where they have one; empty or main takes what the manifest pins.
    required: false
    default: ""
  template-check:
    description: >-
      Whether to check that the shared files agree with the template. Release and Test build
      leave it out: a change to the template must not stop a release before every integration is
      synced, and pull requests check it.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Each Home Assistant tested runs on the oldest Python it requires, which moves with its
    # releases.
    - name: Find the Python each Home Assistant tested requires
      id: python
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../../tools/pythons.py" . | tee -a "$GITHUB_OUTPUT"

    - name: Set up the Python of the oldest Home Assistant supported
      id: minimum-python
      if: steps.python.outputs.minimum != ''
      uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.python.outputs.minimum }}

    # Set up last, so that it is the Python every step runs.
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.python.outputs.newest }}

    - name: Install the test tools, Home Assistant and the libraries
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        OWNER: ${{ github.repository_owner }}
      run: |
        python -m pip install packaging==26.3
        cp requirements-test.txt "$RUNNER_TEMP/requirements.txt"
        "$GITHUB_ACTION_PATH/install.sh" python "$RUNNER_TEMP/requirements.txt" "$BRANCH" "$OWNER"

    - name: Type check (pyright strict)
      shell: bash
      run: pyright

    # Live tests need a real device; they skip themselves without one, and are excluded here.
    # Every line of the integration is covered, and stays so.
    - name: Test
      shell: bash
      run: |
        tools="$GITHUB_ACTION_PATH/../../tools"
        domain=$(python "$tools/repository.py" domain .)
        coverage=$(python "$GITHUB_ACTION_PATH/../../../common/tools/settings.py" coverage .)
        python -m pytest -m "not live" -q -o log_cli=false \
          --cov="custom_components.$domain" --cov-report=term-missing --cov-fail-under="$coverage"

    - name: Check the repository's contract
      shell: bash
      run: python "$GITHUB_ACTION_PATH/../../tools/contract.py" .

    # hacs.json promises the oldest Home Assistant it names as much as the newest: the tests run
    # on both, so that nothing newer than the oldest is used without raising it.
    - name: Find the oldest Home Assistant supported
      id: minimum
      shell: bash
      run: |
        version=$(python "$GITHUB_ACTION_PATH/../../tools/contract.py" minimum .)
        echo "Oldest Home Assistant supported, older than the one pinned: ${version:-none}"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install the test tools and the libraries for the oldest Home Assistant supported
      if: steps.minimum.outputs.version != ''
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        OWNER: ${{ github.repository_owner }}
        HOME_ASSISTANT: ${{ steps.minimum.outputs.version }}
        HARNESS: ${{ steps.python.outputs.harness }}
        PYTHON: ${{ steps.minimum-python.outputs.python-path }}
      run: |
        "$PYTHON" -m venv "$RUNNER_TEMP/minimum"
        oldest="$RUNNER_TEMP/minimum/bin/python"
        # pip finds the release of the test harness made for that Home Assistant.
        "$oldest" -m pip install packaging==26.3 "homeassistant==$HOME_ASSISTANT" "$HARNESS"
        "$oldest" "$GITHUB_ACTION_PATH/../../tools/contract.py" minimum-requirements . \
          > "$RUNNER_TEMP/minimum-requirements.txt"
        "$GITHUB_ACTION_PATH/install.sh" "$oldest" "$RUNNER_TEMP/minimum-requirements.txt" "$BRANCH" "$OWNER"

    - name: Type check (pyright strict) on the oldest Home Assistant supported
      if: steps.minimum.outputs.version != ''
      shell: bash
      run: '"$RUNNER_TEMP/minimum/bin/pyright" --pythonpath "$RUNNER_TEMP/minimum/bin/python"'

    - name: Test on the oldest Home Assistant supported
      if: steps.minimum.outputs.version != ''
      shell: bash
      run: |
        tools="$GITHUB_ACTION_PATH/../../tools"
        domain=$(python "$tools/repository.py" domain .)
        coverage=$(python "$GITHUB_ACTION_PATH/../../../common/tools/settings.py" coverage .)
        "$RUNNER_TEMP/minimum/bin/python" -m pytest -m "not live" -q -o log_cli=false \
          --cov="custom_components.$domain" --cov-report=term-missing --cov-fail-under="$coverage"

    - name: Check the oldest Home Assistant supported against the contract
      if: steps.minimum.outputs.version != ''
      shell: bash
      run: '"$RUNNER_TEMP/minimum/bin/python" "$GITHUB_ACTION_PATH/../../tools/contract.py" minimum-check .'

    - name: Check that the shared files agree with the template
      if: inputs.template-check == 'true'
      shell: bash
      run: python "$GITHUB_ACTION_PATH/../../../common/tools/template.py" check ha .
