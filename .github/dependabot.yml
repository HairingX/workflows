# Proposes updates to the pinned actions and test tools as pull requests, which CI and its canary
# check before Merge Dependabot's updates merges them. The owner is assigned only a new major
# version, or an update a check fails.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /ha/actions/*
      - /python/actions/*
      - /card/actions/*
      - /common/template
      - /ha/template
      - /python/template
      - /card/template
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - dependencies
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - dependencies
    groups:
      test-tools:
        update-types: [minor, patch]
