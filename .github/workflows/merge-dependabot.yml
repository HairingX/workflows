name: Merge Dependabot's updates

# This repository's own: Dependabot's updates are merged once every check passes, the canary's
# among them. An update of an action reaches the other repositories only once published.
on:
  pull_request:

permissions: {}

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  merge:
    name: Merge Dependabot's update
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/dependabot-merge.yml
    with:
      release-drafter: false
