name: Merge the test harness

# Called by an integration's Merge the test harness workflow, on Dependabot's pull request
# updating the test harness. Merges it once every other check of its commit has passed, and fails,
# leaving it open, when one fails. A merge made with this workflow's token starts no push run, so
# it then starts Release Drafter, whose draft Release requires up to date with main.
on:
  workflow_call:

permissions: {}

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  merge:
    name: Merge once every check passes
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: harness-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # The ruleset refuses the merge while a check it requires has not passed, so a check not yet
      # reported only delays it. The commit is named, so a later push is never merged untested.
      - name: Wait for every check, then merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          while true; do
            buckets=$(gh pr checks "$PR" --json bucket,workflow \
              --jq '.[] | select(.workflow != env.WORKFLOW) | .bucket' || true)
            if grep -qxE 'fail|cancel' <<< "$buckets"; then
              echo "::error::A check failed: the integration must follow the newer Home Assistant before this update is merged."
              exit 1
            fi
            if [[ -n "$buckets" ]] && ! grep -qvxE 'pass|skipping' <<< "$buckets" \
              && gh pr merge "$PR" --squash --match-head-commit "$HEAD"; then
              break
            fi
            sleep 30
          done

      - name: Update the release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-drafter.yml --repo "$GITHUB_REPOSITORY" --ref main
